<div class="relative rounded-2xl overflow-hidden border border-gray-200" style="height: 420px">
  <div #mapContainer style="width: 100%; height: 100%"></div>

  @if (!mapReady()) {
    <div class="absolute inset-0 flex items-center justify-center bg-gray-50">
      <div class="flex flex-col items-center gap-2 text-[var(--text-secondary)]">
        <span class="material-icons text-3xl animate-spin">sync</span>
        <span class="text-sm">Cargando mapa...</span>
      </div>
    </div>
  }

  @if (mapReady() && pointsWithLocation.length === 0) {
    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 z-10">
      <div
        class="bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs text-[var(--text-secondary)] border border-gray-200 shadow whitespace-nowrap"
      >
        No hay reportes con ubicación para mostrar
      </div>
    </div>
  }
</div>

<div class="flex flex-wrap items-center gap-4 mt-2 px-1">
  <div class="flex items-center gap-1.5 text-xs text-[var(--text-secondary)]">
    <span class="w-3 h-3 rounded-full inline-block" style="background-color: #2563eb"></span>
    Agrupados
  </div>
  <div class="flex items-center gap-1.5 text-xs text-[var(--text-secondary)]">
    <span class="w-3 h-3 rounded-full inline-block" style="background-color: #f59e0b"></span>
    Perdida
  </div>
  <div class="flex items-center gap-1.5 text-xs text-[var(--text-secondary)]">
    <span class="w-3 h-3 rounded-full inline-block" style="background-color: #10b981"></span>
    Encontrada
  </div>
</div>
