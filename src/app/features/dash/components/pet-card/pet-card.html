<div
  class="bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-200 flex flex-col"
>
  <!-- Foto -->
  <div class="h-40 w-full bg-slate-50 flex items-center justify-center">
    @if (pet.photoUrl) {
      <img [src]="pet.photoUrl" [alt]="pet.name" class="w-full h-full object-cover" />
    } @else {
      <span class="material-icons text-5xl text-slate-300">pets</span>
    }
  </div>

  <!-- Info -->
  <div class="p-4 flex-1 flex flex-col gap-2">
    <div class="flex items-start justify-between gap-2">
      <div>
        <h3 class="font-semibold text-slate-800 text-base">{{ pet.name }}</h3>
        <p class="text-sm text-slate-500">
          {{ pet.speciesName ?? 'Especie' }}
          @if (pet.breedName) {
            · {{ pet.breedName }}
          }
        </p>
      </div>
      <span class="text-xs px-2 py-1 rounded-full bg-teal-50 text-teal-700 font-medium shrink-0">
        {{ sexLabel }}
      </span>
    </div>

    <div class="flex flex-wrap gap-1.5 mt-1">
      <span class="text-xs px-2 py-0.5 rounded-full border border-gray-200 text-slate-500">
        {{ pet.color }}
      </span>
      <span class="text-xs px-2 py-0.5 rounded-full border border-gray-200 text-slate-500">
        {{ sizeLabel }}
      </span>
      @if (pet.sterilized) {
        <span class="text-xs px-2 py-0.5 rounded-full border border-gray-200 text-slate-500">
          Esterilizado/a
        </span>
      }
    </div>

    @if (pet.description) {
      <p class="text-sm text-slate-500 mt-1 leading-relaxed line-clamp-2">
        {{ pet.description }}
      </p>
    }
  </div>

  <!-- Acciones -->
  <div class="px-4 py-3 border-t border-gray-100 flex gap-2">
    <button
      type="button"
      (click)="onEdit()"
      class="flex-1 text-xs font-medium px-3 py-2 rounded-xl border border-gray-200 text-slate-700 hover:bg-slate-50 transition-colors"
    >
      Editar
    </button>
    <button
      type="button"
      (click)="onDelete()"
      class="flex-1 text-xs font-medium px-3 py-2 rounded-xl border border-[var(--danger)] text-[var(--danger)] hover:bg-red-50 transition-colors"
    >
      Eliminar
    </button>
  </div>
</div>
