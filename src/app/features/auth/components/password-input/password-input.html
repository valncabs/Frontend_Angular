<div class="mb-6">
  <label
    class="block text-[10px] font-medium tracking-widest uppercase mb-2"
    style="color: var(--text-secondary)"
  >
    {{ label }}
  </label>

  <div class="relative">
    <input
      [type]="showPassword ? 'text' : 'password'"
      [value]="value"
      [disabled]="disabled"
      [placeholder]="placeholder"
      (input)="updateValue($event)"
      (blur)="blur()"
      class="w-full bg-transparent text-sm pb-2 border-0 border-b focus:outline-none transition-colors duration-200 font-light placeholder-gray-300 pr-10"
      style="color: var(--text-primary); border-color: #e5e7eb"
    />

    <button
      type="button"
      (click)="togglePassword()"
      class="absolute right-0 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
    >
      {{ showPassword ? '' : '' }}
    </button>
  </div>
</div>
