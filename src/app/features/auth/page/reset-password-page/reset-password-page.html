<app-auth-layout>

  <app-auth-card>

    <h1 class="mb-2 text-3xl font-bold text-[var(--text-primary)]">
      Restablecer contraseña
    </h1>

    <p class="mb-8 text-sm text-[var(--text-secondary)]">
      Ingresa una nueva contraseña para tu cuenta.
    </p>

    <div class="space-y-5">

      <app-password-input
        label="Nueva contraseña"
        placeholder="Ingresa tu nueva contraseña">
      </app-password-input>

      <app-password-input
        label="Confirmar contraseña"
        placeholder="Confirma tu nueva contraseña">
      </app-password-input>

    </div>

    <button
      type="button"
      class="btn-primary-custom mt-8 w-full">

      Restablecer contraseña

    </button>

  </app-auth-card>

</app-auth-layout>
