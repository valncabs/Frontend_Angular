<app-auth-layout>

    <app-auth-card>

        <div class="text-center">

            <div class="text-6xl mb-5 text-red-500">
                ✖
            </div>

            <h2 class="text-2xl font-bold">

                No se pudo confirmar el correo  

            </h2>

            <p class="mt-3 text-gray-500">

                El enlace de verificación es inválido, ha expirado o el correo ya fue confirmado.

            </p>

            <button
                class="mt-8 w-full bg-[var(--primary)] text-white py-3 rounded-xl">

                Volver al inicio de sesión

            </button>

        </div>

    </app-auth-card>

</app-auth-layout>
