<app-auth-layout>

    <app-auth-card>

        <h1 class="text-3xl font-bold mb-2">
            Recuperar contraseña
        </h1>

        <p class="text-gray-500 mb-6">
            Ingresa tu correo electrónico.
        </p>

        <app-email-input
            label="Correo electrónico"
            placeholder="Ingresa tu correo">
        </app-email-input>

        <button
            class="w-full mt-5 bg-[var(--primary)] hover:bg-[var(--primary-dark)] text-white py-3 rounded-xl transition">

            Enviar

        </button>

    </app-auth-card>

</app-auth-layout>
