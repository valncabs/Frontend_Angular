<app-auth-layout>
  <p
    class="mb-1 text-2xl font-semibold"
    style="color: var(--text-primary); font-family: 'Montserrat', sans-serif"
  >
    Iniciar sesión
  </p>

  <p class="mb-10 text-xs font-light" style="color: var(--text-secondary)">Bienvenido de nuevo</p>

  <!--form components-->
  <app-email-input></app-email-input>
  <app-password-input></app-password-input>

  <div class="flex justify-end mb-10">
    <a
      class="text-[11px] hover:opacity-100 opacity-80 cursor-pointer"
      style="color: var(--primary)"
      (click)="showForgotPassword = true"
    >
      ¿Olvidaste tu contraseña?
    </a>
  </div>

  <app-modal
    [isOpen]="showForgotPassword"
    title="Recuperar contraseña"
    (close)="showForgotPassword = false"
  >
    <p class="text-sm mb-4">
      Ingresa tu correo electrónico para enviarte un enlace de recuperación.
    </p>

    <app-email-input></app-email-input>

    <button class="btn-primary-custom w-full">Enviar enlace</button>
  </app-modal>

  <div class="flex flex-col gap-3">
    <button type="button" class="btn-primary-custom w-full text-xs tracking-widest uppercase">
      Iniciar sesión
    </button>

<a
  (click)="irARegistro()"
  class="w-full py-3 rounded-full border text-xs font-medium tracking-widest uppercase text-center cursor-pointer"
  style="color: var(--primary); border-color: var(--primary)"
>
  Registrate
</a>
  </div>
</app-auth-layout>
