<div class="flex flex-col gap-1.5">
  @if (label) {
    <label class="text-sm font-medium text-[var(--text-primary)]">
      {{ label }}
    </label>
  }

  <div class="relative">
    <select
      [class]="selectClasses"
      [disabled]="isDisabled()"
      [value]="value()"
      (change)="handleChange($event)"
    >
      <option value="" disabled selected hidden>{{ placeholder }}</option>
      @for (opt of options; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>

    <!-- Chevron icon -->
    <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
      <svg
        class="h-4 w-4 text-[var(--text-secondary)]"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
          clip-rule="evenodd"
        />
      </svg>
    </div>
  </div>

  @if (hasError && errorMessage) {
    <p class="text-xs text-[var(--danger)] flex items-center gap-1">
      <span class="material-icons text-sm">error_outline</span>
      {{ errorMessage }}
    </p>
  } @else if (hint) {
    <p class="text-xs text-[var(--text-secondary)]">{{ hint }}</p>
  }
</div>
