@if (isOpen) {
  <div class="fixed inset-0 z-50 overflow-y-auto">
    <div class="fixed inset-0 bg-black/50" (click)="onBackdropClick()"></div>

    <div class="flex min-h-full items-center justify-center p-4">
      <div
        class="relative bg-white rounded-2xl shadow-xl w-full p-6 z-10 max-h-[90vh] overflow-y-auto scrollbar-hide"
        [class]="sizeClass"
      >
        <h2 class="text-xl font-semibold mb-4">
          {{ title }}
        </h2>

        <ng-content></ng-content>

        @if (dismissible) {
          <div class="flex justify-end mt-6">
            <button class="px-5 py-2 rounded-lg bg-[#2A9D8F] text-white" (click)="closeModal()">
              Cerrar
            </button>
          </div>
        }
      </div>
    </div>
  </div>
}
