<!-- Botón flotante -->
<button
  (click)="abrirCerrar()"
  class="fixed bottom-6 right-6 z-50 flex items-center justify-center text-white transition-all hover:scale-105"
  style="width:52px; height:52px; border-radius:50%; background:#2a9d8f; border:none; cursor:pointer; box-shadow: 0 4px 16px rgba(42,157,143,.4);"
>
  <span *ngIf="!abierto">
    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff"><path d="M160-360q-50 0-85-35t-35-85q0-50 35-85t85-35v-80q0-33 23.5-56.5T240-760h120q0-50 35-85t85-35q50 0 85 35t35 85h120q33 0 56.5 23.5T800-680v80q50 0 85 35t35 85q0 50-35 85t-85 35v160q0 33-23.5 56.5T720-120H240q-33 0-56.5-23.5T160-200v-160Zm242.5-97.5Q420-475 420-500t-17.5-42.5Q385-560 360-560t-42.5 17.5Q300-525 300-500t17.5 42.5Q335-440 360-440t42.5-17.5Zm240 0Q660-475 660-500t-17.5-42.5Q625-560 600-560t-42.5 17.5Q540-525 540-500t17.5 42.5Q575-440 600-440t42.5-17.5ZM320-280h320v-80H320v80Zm-80 80h480v-480H240v480Zm240-240Z"/></svg>
  </span>
  <span *ngIf="abierto" style="font-size:18px; font-weight:300;">✕</span>
</button>

<!-- Ventana del chat -->
<div
  *ngIf="abierto"
  class="fixed bottom-20 right-6 z-50 flex flex-col overflow-hidden"
  style="width:340px; height:520px; border-radius:20px; background:#fff; border:0.5px solid rgba(0,0,0,.1); box-shadow:0 8px 32px rgba(0,0,0,.1), 0 1px 4px rgba(0,0,0,.05); animation:chatIn .22s ease;"
>

  <!-- Encabezado -->
  <div class="flex items-center gap-2.5 px-4 py-3" style="background:#2a9d8f;">
    <div class="flex items-center justify-center rounded-full flex-shrink-0"
         style="width:36px; height:36px; background:rgba(255,255,255,.18); border:1.5px solid rgba(255,255,255,.35); font-size:18px;">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm146.5-204.5Q340-521 340-580t40.5-99.5Q421-720 480-720t99.5 40.5Q620-639 620-580t-40.5 99.5Q539-440 480-440t-99.5-40.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm100-95.5q47-15.5 86-44.5-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160q53 0 100-15.5ZM523-537q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm-43-43Zm0 360Z"/></svg>
    </div>
    <div class="flex-1">
      <h2 class="m-0 font-medium text-white" style="font-size:14px;">Pet AI</h2>
      <p class="m-0 text-white" style="font-size:11px; opacity:.7;">Tu asistente inteligente</p>
    </div>
    <div style="width:8px; height:8px; border-radius:50%; background:#4ADE80; box-shadow:0 0 0 2px rgba(74,222,128,.3);"></div>
    <button (click)="abrirCerrar()"
            class="flex items-center justify-center rounded-full text-white"
            style="width:26px; height:26px; background:rgba(255,255,255,.15); border:none; cursor:pointer; font-size:13px;">✕</button>
  </div>

  <!-- Mensajes -->
  <div #scrollRef class="flex-1 overflow-y-auto flex flex-col gap-2.5 p-3" style="background:#f4f9f8;">

    <div *ngFor="let msg of mensajes">

      <!-- Usuario -->
      <div *ngIf="msg.usuario" class="flex justify-end">
        <div class="text-white text-xs leading-relaxed px-3 py-2"
             style="max-width:80%; background:#2a9d8f; border-radius:18px; border-bottom-right-radius:4px;">
          {{ msg.texto }}
        </div>
      </div>

      <!-- IA -->
      <div *ngIf="!msg.usuario" class="flex items-end gap-2">
        <div class="flex items-center justify-center rounded-full flex-shrink-0"
             style="width:26px; height:26px; background:#2a9d8f; font-size:13px;">🐶</div>
        <div class="text-xs leading-relaxed px-3 py-2 whitespace-pre-wrap"
             style="max-width:83%; background:#fff; border-radius:18px; border-bottom-left-radius:4px; border:0.5px solid rgba(0,0,0,.09); color:#1a1a18;">
          {{ msg.texto }}
        </div>
      </div>

    </div>

    <!-- Indicador de carga -->
    <div *ngIf="cargando" class="flex items-end gap-2">
      <div class="flex items-center justify-center rounded-full flex-shrink-0"
           style="width:26px; height:26px; background:#2a9d8f; font-size:13px;">🐶</div>
      <div class="flex items-center gap-1.5 px-3.5 py-2.5"
           style="background:#fff; border-radius:18px; border-bottom-left-radius:4px; border:0.5px solid rgba(0,0,0,.09);">
        <span class="typing-dot"></span>
        <span class="typing-dot" style="animation-delay:.18s"></span>
        <span class="typing-dot" style="animation-delay:.36s"></span>
      </div>
    </div>

  </div>

  <!-- Input -->
  <div class="px-3 py-2.5" style="background:#fff; border-top:0.5px solid rgba(0,0,0,.08);">
    <div class="flex gap-2 items-center">
      <input
        [(ngModel)]="pregunta"
        (keyup.enter)="enviar()"
        placeholder="Pregunta sobre tu mascota..."
        class="flex-1 text-xs outline-none"
        style="border:0.5px solid #ccd8d7; border-radius:24px; padding:8px 14px; background:#f4f9f8; font-family:inherit; transition:border .15s;"
        (focus)="$event.target.style.borderColor='#2a9d8f'"
        (blur)="$event.target.style.borderColor='#ccd8d7'"
      />
      <button
        (click)="enviar()"
        class="flex items-center justify-center flex-shrink-0"
        style="width:34px; height:34px; border-radius:50%; background:#2a9d8f; border:none; cursor:pointer; transition:transform .1s;"
        (mousedown)="$any($event.target).style.transform='scale(.9)'"
        (mouseup)="$any($event.target).style.transform='scale(1)'"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#fff">
          <path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
        </svg>
      </button>
    </div>
  </div>

</div>
