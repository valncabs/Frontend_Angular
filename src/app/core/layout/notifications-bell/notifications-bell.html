<div class="relative">
  <button
    (click)="toggle()"
    class="relative flex items-center justify-center w-10 h-10 rounded-full text-slate-600 hover:text-[var(--primary)] hover:bg-slate-50 transition duration-200"
    style="border:none; background:transparent; cursor:pointer;"
    aria-label="Notificaciones"
  >
    <lucide-angular name="bell" [size]="22" [color]="'currentColor'"></lucide-angular>

    @if (messaging.unreadCount() > 0) {
      <span
        class="absolute flex items-center justify-center rounded-full bg-red-500 text-white font-semibold"
        style="min-width:17px; height:17px; font-size:9px; top:1px; right:1px; padding:0 3px; border:2px solid #fff;"
      >{{ messaging.unreadCount() > 99 ? '99+' : messaging.unreadCount() }}</span>
    }
  </button>

  @if (open) {
    <div
      class="absolute right-0 top-12 w-80 max-h-[420px] flex flex-col overflow-hidden rounded-2xl bg-white border border-slate-100 shadow-xl z-50"
      style="animation: bellIn .18s ease;"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between px-4 py-3 border-b" style="border-color:rgba(0,0,0,.06);">
        <h3 class="m-0 text-sm font-semibold text-slate-800">Notificaciones</h3>
        @if (messaging.notifications().some((n) => !n.is_read)) {
          <button
            (click)="marcarTodas()"
            class="text-[11px] text-[var(--primary)] font-medium"
            style="border:none; background:transparent; cursor:pointer;"
          >Marcar todas como leídas</button>
        }
      </div>

      <div class="flex-1 overflow-y-auto" style="max-height:320px;">
        @if (messaging.notifications().length === 0) {
          <div class="flex flex-col items-center gap-2 text-center py-10 px-6">
            <lucide-angular name="bell-off" [size]="28" [color]="'#94a3b8'"></lucide-angular>
            <p class="m-0 text-xs text-slate-500" style="line-height:1.5;">
              No tienes notificaciones por ahora.
            </p>
          </div>
        }

        @for (notification of messaging.notifications(); track notification.id) {
          <button
            (click)="abrirNotificacion(notification)"
            class="w-full flex items-start gap-2.5 px-4 py-3 text-left transition-colors hover:bg-slate-50"
            style="border:none; background:transparent; cursor:pointer; border-bottom:0.5px solid rgba(0,0,0,.04);"
          >
            <span
              class="flex items-center justify-center rounded-full flex-shrink-0 text-white"
              style="width:30px; height:30px; background:#2a9d8f; margin-top:2px;"
            >@if (notification.type === 'FOUND_MATCH') {
              <lucide-angular name="paw-print" [size]="15" [color]="'#ffffff'"></lucide-angular>
            } @else {
              <lucide-angular name="message-square" [size]="15" [color]="'#ffffff'"></lucide-angular>
            }</span>
            <span class="flex-1 min-w-0">
              <span class="flex items-center justify-between gap-2">
                <span class="text-xs font-semibold text-slate-800 truncate">
                  {{ notification.title }}
                </span>
                @if (!notification.is_read) {
                  <span
                    class="flex-shrink-0 rounded-full"
                    style="width:7px; height:7px; background:#2a9d8f;"
                  ></span>
                }
              </span>
              <span class="block text-[11px] text-slate-500 mt-0.5" style="line-height:1.4;">
                {{ notification.message }}
              </span>
              <span class="block text-[10px] text-slate-400 mt-1">
                {{ formatoFecha(notification.created_at) }}
              </span>
            </span>
          </button>
        }
      </div>

      <button
        (click)="irAMensajes()"
        class="py-2.5 text-xs font-medium text-center"
        style="background:#f4f9f8; color:#2a9d8f; border:none; cursor:pointer; border-top:0.5px solid rgba(0,0,0,.06);"
      >Ver mensajería</button>
    </div>
  }
</div>
